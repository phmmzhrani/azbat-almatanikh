<style>
/* Layout: one narrow column like a field notebook; sticky header with trip status and four tabs; content grouped by category. */
:root{
  --bg:#ECEEE8; --surface:#F8F9F5; --ink:#1E2622; --muted:#5E6A63; --line:#D3D8CF;
  --accent:#2F6A4A; --accent-ink:#FFFFFF; --accent-soft:#DCE9E0;
  --saffron:#B7791A; --saffron-soft:#F3E6CC; --danger:#A23B2C; --danger-soft:#F2DCD7;
  --f-display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-brand:"Aref Ruqaa","El Messiri",Tahoma,serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171A; --surface:#1A2125; --ink:#E6EAE5; --muted:#9AA79F; --line:#2B353A;
  --accent:#7DBB94; --accent-ink:#0F1A14; --accent-soft:#1F3328;
  --saffron:#E0A94A; --saffron-soft:#3A2E17; --danger:#E08473; --danger-soft:#3B201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171A; --surface:#1A2125; --ink:#E6EAE5; --muted:#9AA79F; --line:#2B353A;
  --accent:#7DBB94; --accent-ink:#0F1A14; --accent-soft:#1F3328;
  --saffron:#E0A94A; --saffron-soft:#3A2E17; --danger:#E08473; --danger-soft:#3B201B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.trip{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.trip h1{font-family:var(--f-brand);font-weight:700;font-size:32px;line-height:1.35;margin:0;text-wrap:balance}
.trip .sub{color:var(--muted);font-size:13px;margin-top:2px}
.me{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.me b{font-weight:600}
.progress{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav.tabs button{flex:1;min-width:max-content;border:0;background:none;padding:10px 8px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .n{font-size:12px;background:var(--line);border-radius:99px;padding:0 7px;margin-inline-start:4px;font-variant-numeric:tabular-nums}

.banner{margin-top:14px;padding:10px 12px;border-radius:var(--r);background:var(--saffron-soft);color:var(--ink);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

section.cat{margin-top:18px}
.cat-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.cat-h h2{font-family:var(--f-display);font-size:18px;font-weight:500;margin:0;flex:1 1 60%;min-width:0}
.cat-h .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.owner{font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px}
.link{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 2px}
.link.danger{color:var(--danger)}

ul.items{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tick{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;padding:0}
.tick svg{width:15px;height:15px;opacity:0}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tick[aria-checked="true"] svg{opacity:1;stroke:var(--accent-ink)}
.tick:disabled{opacity:.35;cursor:not-allowed}
.nm{min-width:0}
.nm .t{font-weight:500}
li.done .nm .t{text-decoration:line-through;color:var(--muted)}
.nm .q{color:var(--muted);font-size:13px;margin-inline-start:6px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px;font-size:12px;color:var(--muted)}
.tag{border-radius:6px;padding:0 7px;font-size:12px}
.tag.sug{background:var(--saffron-soft);color:var(--ink)}
.who{background:var(--accent-soft);border-radius:999px;padding:0 9px;color:var(--ink)}
.who.mine{background:var(--accent);color:var(--accent-ink)}
.act{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.card h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font-size:12px;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.pos{color:var(--accent);font-weight:600}.neg{color:var(--danger);font-weight:600}
.big{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.transfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.transfer .amt{margin-inline-start:auto;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:grid;place-items:end center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:max(18px,env(safe-area-inset-left,0px));z-index:6;box-shadow:0 4px 14px rgb(0 0 0 / .18);border-radius:999px;padding:12px 18px;font-size:15px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.nmb{border:0;background:none;padding:0;text-align:right;width:100%;display:block}
.nmb:hover .t{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.edit-ic{font-size:12px;color:var(--muted);margin-inline-start:6px}
.cheer{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgb(0 0 0 / .35);cursor:pointer}
.cheer canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cheer .box{position:relative;background:var(--surface);border:3px solid var(--saffron);border-radius:18px;padding:22px 26px;max-width:min(90vw,420px);text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.cheer .kafo{font-family:var(--f-brand);font-size:44px;line-height:1.1;color:var(--saffron);font-weight:700}
.cheer .line{font-size:17px;margin-top:8px;font-weight:600}
.cheer .small{font-size:13px;color:var(--muted);margin-top:6px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.brand{font-family:var(--f-brand);font-size:18px;font-weight:700;color:var(--saffron);line-height:1.3}
.maplink[hidden]{display:none}
body.is-locked #fab,body.is-locked nav.tabs,body.is-locked .progress,body.is-locked #meBtn,body.is-locked #tripSub,body.is-locked #mapLink{display:none!important}
.lockcard{margin-top:28px;text-align:center}
.wa{background:#1F8F4E;color:#fff;border-color:#1F8F4E;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.sharecard .row{gap:10px}
.maplink{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
details.arc{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-top:10px}
details.arc summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;list-style:none}
details.arc summary::-webkit-details-marker{display:none}
details.arc summary b{font-family:var(--f-display);font-weight:500;font-size:16px}
details.arc summary .s{font-size:12px;color:var(--muted)}
details.arc summary .pill{margin-inline-start:auto}
details.arc .in{padding:0 12px 12px}
.pill{font-size:12px;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ink)}
.pill.due{background:var(--danger-soft);color:var(--ink)}
.toast.win{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;padding:10px 20px}
@media (prefers-reduced-motion:reduce){.cheer .box{animation:none}}
</style>

</head>
<body>
<div dir="rtl" lang="ar">
<div class="wrap">
  <header class="top">
    <div class="trip">
      <div>
        <div class="brand">عزبة المطانيخ</div>

      </div>
      <button class="me" id="meBtn" type="button">أنت: <b id="meName">اختر اسمك</b></button>

  </header>
  <div id="banner"></div>
  <main id="view"><p class="empty">جاري تحميل القائمة</p></main>
</div>
<button class="btn primary fab" id="fab" type="button">إضافة غرض</button>
<div id="layer"></div>
<div id="fx"></div>
</div>

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function errOf(status,body){ let j=null; try{ j=JSON.parse(body); }catch(e){} const code=j&&j.code; const msg=(j&&(j.message||j.hint))||body||"";
  if(code==="42501"||/forbidden/.test(msg)) return {code:/admin/.test(msg)?"admin_required":"forbidden",message:msg};
  if(status>=500||status===0) return {code:"unavailable",message:msg};
  return {code:"invalid_argument",message:msg}; }
async function rpc(fn,args){
  for(let i=0;;i++){
    let res, body="";
    try{ res=await fetch(CFG.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":CFG.key,"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(Object.assign({k:GK},args))});
      body=await res.text(); }
    catch(e){ res={ok:false,status:0}; }
    if(res.ok){ return body?JSON.parse(body):null; }
    const err=errOf(res.status,body);
    if(err.code==="unavailable"&&i<3){ await sleep(500*(i+1)+Math.random()*300); continue; }
    throw err;
  }
}
async function parallel(fns,n){ n=n||8; let i=0; const run=async()=>{ while(i<fns.length){ const f=fns[i++]; await f(); } }; await Promise.all(Array.from({length:Math.min(n,fns.length)},run)); }
const DOCS={meta:{},cats:{},items:{},members:{},expenses:{},payments:{},archive:{}};
function applyRows(rows){
  let changed=false;
  for(const r of rows||[]){
    const box=DOCS[r.col]; if(!box) continue;
    const cur=box[r.id];
    if(cur&&cur.rev>=r.rev) continue;
    box[r.id]=r.deleted?{rev:r.rev,deleted:true}:{rev:r.rev,data:r.data};
    if(r.rev>lastRev) lastRev=r.rev;
    changed=true;
  }
  if(!changed&&S.loaded.cats) return;
  const arr=c=>Object.entries(DOCS[c]).filter(([,v])=>!v.deleted&&v.data).map(([id,v])=>Object.assign({id},v.data));
  const t=DOCS.meta.trip; S.trip=Object.assign({name:"كشتة البر",place:"",map:"",date:"",endDate:"",time:""},t&&!t.deleted&&t.data?t.data:{});
  for(const c of ["cats","items","members","expenses","payments","archive"]){ S[c]=arr(c); S.loaded[c]=1; }
  render();
}
function pull(force){
  if(pulling) return force?pulling.then(()=>pull()):pulling;
  pulling=(async()=>{
    try{ const rows=await rpc("azba_pull",{since:Math.max(0,lastRev-20)}); failCount=0; if(S.offline){ S.offline=false; render(); } applyRows(rows); }
    catch(e){ if(e.code==="forbidden"){ lock("bad"); return; } failCount++; if(failCount>1&&!S.offline){ S.offline=true; render(); } }
    finally{ pulling=null; }
  })();
  return pulling;
}
function schedule(){ clearTimeout(pollTimer); if(document.hidden) return; pollTimer=setTimeout(async()=>{ await pull(); schedule(); },CFG.poll); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&GK){ pull(); schedule(); } });
const store={
  async set(col,id,data){ const v=await rpc("azba_set",{c:col,i:id,doc:data}); await pull(true); return v; },
  async update(col,id,data){ const v=await rpc("azba_patch",{c:col,i:id,patch:data}); await pull(true); return v; },
  async del(col,id){ const v=await rpc("azba_delete",{c:col,i:id,admin:col==="archive"?ADMIN:null}); await pull(true); return v; },
  async get(col,id){ return await rpc("azba_get",{c:col,i:id}); },
  async add(col,data){ const id=col[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await store.set(col,id,data); return id; }
};

function readKey(){
  const m=/[#&]k=([A-Za-z0-9]{12,64})/.exec(location.hash||"");
  if(m){ ls.set("azba.k",m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} return m[1]; }
  return ls.get("azba.k")||null;
}
function lock(why){
  S.locked=why; clearTimeout(pollTimer);
  if(why==="bad") ls.set("azba.k","");

  $("#view").innerHTML='<div class="card lockcard"><h3>'+(why==="bad"?"الرابط انتهى أو تغيّر":"الدخول بالرابط فقط")+'</h3><p>'+(why==="bad"?"اطلب الرابط الجديد من قروب الواتساب، وافتحه من نفس الجوال.":"هذي صفحة خاصة بربع الكشتة. افتحها من الرابط اللي انرسل في قروب الواتساب.")+'</p></div>';
}

function safeUrl(u){ u=String(u||"").trim(); return /^https:\/\/[^\s"'<>]+$/i.test(u)?u:""; }

function fmtTime(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); if(isNaN(h)) return t; const ap=h<12?"ص":"م", hh=h%12||12; return hh+":"+String(m||0).padStart(2,"0")+" "+ap; }

  const filt=it=>F==="all"||(F==="free"&&!it.by)||(F==="left"&&!it.done&&!it.sug)||(F==="sug"&&it.sug);
  const counts={free:S.items.filter(i=>!i.by).length,left:S.items.filter(i=>!i.done&&!i.sug).length,sug:S.items.filter(i=>i.sug).length};

function settle(){
  const people=S.members.map(m=>({id:m.id,name:m.name,share:m.share==null?1:+m.share,paid:0}));
  let orphan=0;
  for(const e of S.expenses){ const p=people.find(x=>x.id===e.by); if(p) p.paid+=+e.amount||0; else orphan+=+e.amount||0; }
  const total=S.expenses.reduce((s,e)=>s+(+e.amount||0),0);
  const shares=people.reduce((s,p)=>s+p.share,0);
  people.forEach(p=>{ p.due=shares?total*p.share/shares:0; p.sent=0; p.got=0; });
  for(const x of S.payments){ const f=people.find(p=>p.id===x.from), t=people.find(p=>p.id===x.to), a=+x.amount||0; if(f) f.sent+=a; if(t) t.got+=a; }
  people.forEach(p=>{ p.bal=p.paid-p.due+p.sent-p.got; });
  const cred=people.filter(p=>p.bal>0.005).map(p=>({id:p.id,name:p.name,r:p.bal})).sort((a,b)=>b.r-a.r);
  const debt=people.filter(p=>p.bal<-0.005).map(p=>({id:p.id,name:p.name,r:-p.bal})).sort((a,b)=>b.r-a.r);
  const tx=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){ const a=Math.min(debt[i].r,cred[j].r);
    if(a>=0.01) tx.push({from:debt[i].name,to:cred[j].name,fromId:debt[i].id,toId:cred[j].id,amt:a}); debt[i].r-=a; cred[j].r-=a;
    if(debt[i].r<0.005) i++; if(cred[j].r<0.005) j++; }
  return {people,total,shares,tx,orphan};
}

    +'<div class="row" style="margin-top:14px" id="editBtns"><button class="btn primary" data-a="saveEdit">حفظ</button><button class="btn ghost" data-a="close">إلغاء</button><span style="flex:1"></span><button class="btn danger" data-a="delItem">حذف الغرض</button></div>',{item:id,orig:{name:it.name,qty:it.qty||"",cat:it.cat,by:it.by||""}});
}
function openExpense(id){
  if(!S.members.length){ toast("أضف المشاركين أول"); return; }
  const e=id?S.expenses.find(x=>x.id===id):null;
  sheet('<h3>'+(e?"تعديل مصروف":"تسجيل مصروف")+'</h3><div class="row"><div class="field"><label for="xAmt">المبلغ بالريال</label><input id="xAmt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" value="'+(e?e.amount:"")+'"></div>'
    +'<div class="field"><label for="xBy">من دفع</label><select id="xBy">'+memOptions(e?e.by:S.me)+'</select></div>'
    +'<div class="field" style="flex-basis:100%"><label for="xNote">البيان</label><input id="xNote" maxlength="50" placeholder="مثال: الذبيحة، مقاضي الفطور" value="'+esc(e?e.note:"")+'"></div></div>'
    +'<div class="row" style="margin-top:14px"><button class="btn primary" data-a="saveExp">حفظ</button><button class="btn ghost" data-a="close">إلغاء</button></div>',{exp:id||null});
}
function openCat(){
  sheet('<h3>فئة جديدة</h3><div class="field"><label for="cName">اسم الفئة</label><input id="cName" maxlength="30" placeholder="مثال: ألعاب الأطفال"></div>'
    +'<div class="row" style="margin-top:14px"><button class="btn primary" data-a="saveCat">إضافة</button><button class="btn ghost" data-a="close">إلغاء</button></div>');
}

let adminWait=null;
function needAdmin(){
  if(ADMIN) return Promise.resolve(true);
  sheet('<h3>رمز المشرف</h3><p class="hint" style="margin-top:0">هذي العملية للمشرف فقط.</p><div class="field"><label for="adminPin">الرمز</label><input id="adminPin" type="password" inputmode="numeric" maxlength="10" autocomplete="off"></div>'
    +'<div class="row" style="margin-top:14px"><button class="btn primary" data-a="adminOk">دخول</button><button class="btn ghost" data-a="close">إلغاء</button></div>');
  return new Promise(res=>{ adminWait=res; });
}
/* ---------- celebration ---------- */
let tt;
function toast(m){ show(m,""); }
function winToast(m){ show(m,"win"); }
function show(m,cls,ms){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.setAttribute("role","status"); document.body.appendChild(el); } el.className="toast "+cls; el.textContent=m; clearTimeout(tt); tt=setTimeout(()=>el.remove(),ms||(cls?2600:2200)); }
function celebrate(cat,n){
  const c=pick(CHEER_CAT), o={n:nameOf(S.me),c:cat};
  const fx=$("#fx");
  fx.innerHTML='<div class="cheer" data-a="closeCheer" role="status"><canvas></canvas><div class="box"><div class="kafo">'+esc(c[0])+'</div><div class="line">'+esc(fill(c[1],o))+'</div><div class="small">'+esc(c[2])+(n?" · "+n+" غرض صار عليك":"")+'</div></div></div>';
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const end=setTimeout(()=>{ fx.innerHTML=""; },3200);
  fx.firstChild.addEventListener("click",()=>{ clearTimeout(end); fx.innerHTML=""; });
  if(reduce) return;
  const cv=fx.querySelector("canvas"), ctx=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement), cols=[cs.getPropertyValue("--saffron"),cs.getPropertyValue("--accent"),cs.getPropertyValue("--danger"),"#E8C547","#5AA9E6"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)].trim()}));
  let f=0; (function step(){ if(!cv.isConnected) return; ctx.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if(++f<180) requestAnimationFrame(step); })();
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const tab=e.target.closest("nav.tabs button");
  if(tab){ S.tab=tab.dataset.tab; S.confirm=null; ls.set("azba.tab",S.tab); render(); window.scrollTo(0,0); return; }
  if(e.target.closest("#meBtn")){ openWho(); return; }
  if(e.target.closest("#fab")){ if(needMe()) openAdd(); return; }
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id;
  if(a==="closeBg"&&e.target!==b) return;
  if(a==="closeCheer") return;
  switch(a){
    case "claim": case "unclaim": case "tick": case "approve": case "approveCat": case "claimCat": case "unclaimCat":
      S.confirm=null; await act[a](id); break;
    case "delExp": case "delMember": await act[a](id); break;
    case "cancel": S.confirm=null; render(); break;
    case "filter": S.filter=b.dataset.f; render(); break;
    case "template": await loadTemplate(); break;
    case "reset": if(!(await needAdmin())) return; if(S.confirm!=="reset"){ S.confirm="reset"; render(); } else { S.confirm=null; await newTrip(); } break;
    case "who": openWho(); break;
    case "close": case "closeBg": close(); break;
    case "edit": openEdit(id); break;
    case "pickMe": S.me=id; ls.set("azba.me",id); close(); render(); winToast("هلا والله يا "+nameOf(id)); break;
    case "joinMe": { const n=norm($("#whoNew").value); if(!n){ toast("اكتب اسمك"); return; }
      const ex=S.members.find(m=>norm(m.name)===n); if(ex){ S.me=ex.id; ls.set("azba.me",ex.id); close(); render(); winToast("هلا والله يا "+n); return; }
      let nid=null; await guard(async()=>{ nid=await store.add("members",{name:n,share:1,t:Date.now()}); });
      if(nid){ S.me=nid; ls.set("azba.me",nid); close(); render(); winToast("حياك الله يا "+n+"، نورت الكشتة"); } break; }
    case "addMember": { const inp=$("#newMem"), n=norm(inp.value); if(!n) return;
      if(S.members.some(m=>norm(m.name)===n)){ toast("الاسم موجود"); return; }
      if(await guard(()=>store.add("members",{name:n,share:1,t:Date.now()}))) toast("انضم "+n); break; }
    case "saveItem": { const n=norm($("#aName").value); if(!n){ toast("اكتب اسم الغرض"); return; }
      const cid=$("#aCat").value, c=S.cats.find(x=>x.id===cid), mine=$("#aMine").checked;
      if(itemsOf(cid).some(i=>norm(i.name)===n)){ toast("الغرض موجود في نفس الفئة، عدل كميته بدل ما تضيفه"); return; }
      ls.set("azba.lastCat",cid);
      const by=mine?S.me:(c&&c.owner?c.owner:"");
      if(await guard(()=>store.add("items",{name:n,qty:norm($("#aQty").value),cat:cid,by:by,done:false,sug:true,addedBy:S.me||"",t:Date.now()}))){
        close(); if(mine) winToast(fill(pick(CHEER_ITEM),{n:nameOf(S.me)})); else toast("أضيف كاقتراح"); } break; }
    case "saveEdit": { const iid=sheetCtx&&sheetCtx.item, it=S.items.find(i=>i.id===iid); if(!it){ close(); return; }
      const n=norm($("#eName").value); if(!n){ toast("اسم الغرض مطلوب"); return; }
      const cid=$("#eCat").value, by=$("#eBy").value;
      if(itemsOf(cid).some(i=>i.id!==iid&&norm(i.name)===n)){ toast("فيه غرض بنفس الاسم في الفئة"); return; }
      const o=sheetCtx.orig||{}, patch={}, qv=norm($("#eQty").value);
      if(n!==o.name) patch.name=n; if(qv!==o.qty) patch.qty=qv; if(cid!==o.cat) patch.cat=cid;
      if(by!==o.by){ patch.by=by; if(!by) patch.done=false; }
      if(!Object.keys(patch).length){ close(); return; }  /* only send what this person changed */
      if(await guard(()=>store.update("items",iid,patch))){ close(); toast("حفظ التعديل"); } break; }
    case "delItem": { const iid=sheetCtx&&sheetCtx.item; if(!iid) return;
      if(b.textContent!=="أكد الحذف"){ b.textContent="أكد الحذف"; return; }
      if(await guard(()=>store.del("items",iid))){ close(); toast("حذف الغرض"); } break; }
    case "saveExp": { const amt=parseFloat($("#xAmt").value); if(!(amt>0)){ toast("اكتب مبلغ صحيح"); return; }
      const data={by:$("#xBy").value,amount:Math.round(amt*100)/100,note:norm($("#xNote").value)};
      const eid=sheetCtx&&sheetCtx.exp;
      const ok=await guard(()=>eid?store.update("expenses",eid,data):store.add("expenses",Object.assign(data,{t:Date.now()})));
      if(ok){ close(); toast(eid?"حفظ التعديل":"سجل المصروف"); } break; }
    case "editExp": openExpense(id); break;
    case "newCat": openCat(); break;
    case "saveCat": { const n=norm($("#cName").value); if(!n) return;
      if(S.cats.some(c=>norm(c.name)===n)){ toast("الفئة موجودة"); return; }
      const o=S.cats.reduce((m,c)=>Math.max(m,c.order||0),0)+1;
      if(await guard(()=>store.set("cats","c"+Date.now().toString(36),{name:n,order:o,owner:""}))){ close(); toast("أضيفت الفئة"); } break; }
    case "saveTrip": { const raw=$("#tMap").value.trim(), mu=safeUrl(raw);
      if(raw&&!mu){ toast("الرابط لازم يبدأ بـ https، انسخه من زر المشاركة في خرائط جوجل"); return; }
      const d=$("#tDate").value, en=$("#tEnd").value;
      if(d&&en&&en<d){ toast("تاريخ العودة قبل تاريخ الطلعة"); return; }
      if(await guard(()=>store.set("meta","trip",{name:norm($("#tName").value)||"كشتة البر",place:norm($("#tPlace").value),map:mu,date:d,endDate:en,time:$("#tTime").value})))
        toast(mu&&!isMapUrl(mu)?"حفظت، لكن الرابط ما يبدو من خرائط جوجل":"حفظت بيانات الطلعة");
      break; }
    case "pay": { const amt=Math.round(parseFloat(b.dataset.amt)*100)/100; if(!(amt>0)) return;
      if(await guard(()=>store.add("payments",{from:b.dataset.from,to:b.dataset.to,amount:amt,t:Date.now()}))) winToast("كفو، سجلنا التحويل"); break; }
    case "unpay": if(S.confirm!==id){ S.confirm=id; render(); return; } S.confirm=null; await guard(()=>store.del("payments",id)); break;
    case "arcPay": { const a=S.archive.find(x=>x.id===id); if(!a) return; const i=+b.dataset.i;
      const tr=(a.transfers||[]).map((t,k)=>k===i?Object.assign({},t,{paid:!t.paid}):t);
      if(await guard(()=>store.update("archive",id,{transfers:tr}))) toast(tr[i].paid?"تم تسجيل التحويل":"رجع غير مدفوع"); break; }
    case "delArc": if(!(await needAdmin())) return; if(S.confirm!==id){ S.confirm=id; render(); return; } S.confirm=null; if(await guard(()=>store.del("archive",id))) toast("حذفت من الأرشيف"); break;
    case "expense": if(needMe()) openExpense(); break;
    case "copy": copySummary(); break;
    case "copyLink": { const t=inviteLink(); try{ await navigator.clipboard.writeText(t); toast("نسخ الرابط"); }catch(e){ fallback(t); } break; }
    case "adminOk": { const pin=$("#adminPin").value.trim(); if(!pin) return;
      if(await checkAdmin(pin)){ ADMIN=pin; ls.set("azba.admin",pin); close(); winToast("أهلا بالمشرف"); if(adminWait){ adminWait(true); adminWait=null; } }
      else toast("الرمز غير صحيح"); break; }
  }
});
document.addEventListener("change",e=>{ const id=e.target.dataset&&e.target.dataset.share; if(id) act.share(id,e.target.value); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#fx").innerHTML){ $("#fx").innerHTML=""; return; } if($("#layer").innerHTML){ close(); return; } }
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox"){ const map={whoNew:"joinMe",newMem:"addMember",aName:"saveItem",aQty:"saveItem",adminPin:"adminOk",eName:"saveEdit",eQty:"saveEdit",tName:"saveTrip",tPlace:"saveTrip",tMap:"saveTrip",xAmt:"saveExp",xNote:"saveExp",cName:"saveCat"};
    const a=map[e.target.id]; if(a){ e.preventDefault(); const btn=document.querySelector('[data-a="'+a+'"]'); if(btn) btn.click(); } }
});

function summaryText(){
  const T=S.trip; let t="عزبة المطانيخ\n"+(T.name||"كشتة البر")+(T.place?" - "+T.place:"")+"\n"+(whenText(T)?whenText(T)+"\n":"")+(safeUrl(T.map)?"الموقع: "+safeUrl(T.map)+"\n":"")+"\n";
  for(const c of sortedCats()){ const its=itemsOf(c.id).filter(i=>!i.sug); if(!its.length) continue;
    t+="*"+c.name+"*\n"; for(const i of its) t+=(i.done?"[تم] ":"[  ] ")+i.name+(i.qty?" ("+i.qty+")":"")+" - "+(i.by?nameOf(i.by):"بدون مسؤول")+"\n"; t+="\n"; }
  const R=settle(); if(R.total){ t+="*الحساب*\nالإجمالي: "+money(R.total)+" ريال\n"; for(const x of S.payments) t+="[مدفوع] "+(nameOf(x.from)||"عضو محذوف")+" حوّل إلى "+(nameOf(x.to)||"عضو محذوف")+": "+money(+x.amount||0)+" ريال\n";
    for(const x of R.tx) t+="[باقي] "+x.from+" يحول إلى "+x.to+": "+money(x.amt)+" ريال\n"; }
  return t;
}
function copySummary(){
  const t=summaryText();
  try{ navigator.clipboard.writeText(t).then(()=>toast("نسخ الملخص، الصقه في القروب"),()=>fallback(t)); }catch(e){ fallback(t); }
}
function fallback(t){ sheet('<h3>انسخ الملخص</h3><textarea id="sumTxt" style="width:100%;height:50vh;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit">'+esc(t)+'</textarea><div class="row" style="margin-top:10px"><button class="btn ghost" data-a="close">إغلاق</button></div>'); const ta=$("#sumTxt"); ta.focus(); ta.select(); }

window.__kashta={S,settle,summaryText,pull};
render(); boot();
})();
</script>
